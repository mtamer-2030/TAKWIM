<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PHILO-TECH · لوحة الأستاذ{% endblock %}</title>
  <link rel="stylesheet" href="/static/vendor/tabler.rtl.min.css">
  <link rel="stylesheet" href="/static/v2/theme.css">
</head>
<body class="pt-admin">
  {% if show_nav|default(true) %}
  <header class="navbar navbar-expand-md navbar-light d-print-none" style="background:#0d47a1">
    <div class="container-xl">
      <a href="/admin" class="navbar-brand text-white">PHILO-TECH · لوحة الأستاذ</a>
      <div class="navbar-nav flex-row order-md-last">
        <a class="nav-link text-white" href="/admin/logout">خروج</a>
      </div>
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link text-white" href="/admin">اللوحة</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/admin/import">استيراد</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/admin/rosters">التلاميذ</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/admin/texts">النصوص</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/admin/curriculum">المنهاج</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/admin/events">التقاويم</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/admin/qr">رمز QR</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="/admin/ai">التدخّل العلاجي (AI)</a></li>
      </ul>
    </div>
  </header>
  {% endif %}
  <div class="page-wrapper">
    <div class="page-body">
      <div class="container-xl">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>
  <script src="/static/vendor/tabler.min.js" defer></script>
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/vendor/alpine.min.js" defer></script>
  <script src="/static/vendor/chart.umd.min.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
