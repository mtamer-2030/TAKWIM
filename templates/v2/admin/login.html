{% extends "admin/base.html" %}
{% set show_nav = false %}
{% block title %}دخول · PHILO-TECH{% endblock %}
{% block content %}
<div class="row justify-content-center" style="margin-top:8vh">
  <div class="col-11 col-sm-8 col-md-5">
    <div class="card card-md">
      <div class="card-body">
        <h2 class="h2 text-center mb-3">PHILO-TECH · لوحة الأستاذ</h2>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="post" action="/admin/login">
          <div class="mb-3">
            <label class="form-label">كلمة السرّ</label>
            <input type="password" name="password" class="form-control" autofocus>
          </div>
          <button class="btn btn-primary w-100" type="submit">دخول</button>
          <p class="text-secondary mt-2 mb-0" style="font-size:.85rem">
            كلمة السرّ في ملفّ config.ini.</p>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
