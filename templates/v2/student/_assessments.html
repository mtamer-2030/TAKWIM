<h3 style="margin:.2rem 0 1rem">التقاويم</h3>
{% for quiz in quizzes %}
  <a class="pt-card" style="display:flex;justify-content:space-between;align-items:center;color:inherit;text-decoration:none"
     href="/student/quiz/{{ quiz.id }}">
    <span>
      <span style="font-weight:700">{{ quiz.title }}</span>
      <span class="muted" style="font-size:.85rem"> · {{ quiz.kind }}</span>
    </span>
    {% if quiz.id in done %}
      <span style="color:#2e7d32;font-size:.85rem">مُنجَز ✓ — أعِد المحاولة</span>
    {% else %}
      <span style="color:#0d47a1;font-size:.9rem">ابدأ ←</span>
    {% endif %}
  </a>
{% else %}
  <div class="pt-card muted">لا تقويم متاح لمستوى/فوجك الآن.</div>
{% endfor %}
