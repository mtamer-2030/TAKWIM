{% extends "student/base.html" %}
{% block title %}{{ text.title }} · PHILO-TECH{% endblock %}
{% block body %}
<div class="pt-shell">
  <div class="pt-header">
    <a href="/student/home" style="color:#fff;text-decoration:none">→ رجوع</a>
    <span class="brand" style="font-size:.95rem">نصّ فلسفي</span>
  </div>
  <div class="pt-main">
    <h2 style="margin:.2rem 0">{{ text.title }}</h2>
    {% if text.author %}<div class="muted" style="margin-bottom:.6rem">{{ text.author }}</div>{% endif %}
    <div class="pt-reader">{{ text.content }}</div>
  </div>
</div>
{% endblock %}
