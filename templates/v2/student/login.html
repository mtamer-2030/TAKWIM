{% extends "student/base.html" %}
{% block title %}دخول · PHILO-TECH{% endblock %}
{% block body %}
<div class="pt-shell">
  <div class="pt-header"><span class="brand">PHILO-TECH</span></div>
  <div class="pt-main">
    <div style="text-align:center;margin:2rem 0 1rem">
      <div style="font-size:1.4rem;font-weight:700">مرحباً بك</div>
      <div class="muted">أدخل رمز مسار أو رمز الدخول</div>
    </div>
    {% if error %}<div class="pt-card" style="border-color:#e53935;color:#b71c1c">{{ error }}</div>{% endif %}
    <form method="post" action="/student/login">
      <!-- تسمية مرتبطة بالحقل: لمسُها يُركّز الحقل ويرفع لوحة المفاتيح على كلّ
           الهواتف. لا نستعمل autofocus ولا focus()‎ برمجيّاً — على أندرويد/المتصفّحات
           المدمجة يجعل الحقل «مركَّزاً» سلفاً فلا يرفع لمسُه لاحقاً لوحة المفاتيح. -->
      <label for="code" class="muted"
             style="display:block;text-align:center;margin-bottom:.5rem;font-weight:700">
        اضغط هنا واكتب رمزك ⌨️</label>
      <input id="code" name="code" class="pt-input" type="text"
             autocomplete="off" autocapitalize="characters" autocorrect="off"
             spellcheck="false" inputmode="text" enterkeyhint="go"
             placeholder="مثال: D161055238" required value="{{ code or '' }}">
      <div style="height:1rem"></div>
      <button class="pt-btn" type="submit">دخول</button>
    </form>
    <p class="muted" style="text-align:center;margin-top:1rem;font-size:.85rem">
      بلا كلمة سرّ وبلا بريد إلكتروني — رمزك يكفي.</p>
  </div>
</div>
{% endblock %}
