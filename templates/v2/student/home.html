{% extends "student/base.html" %}
{% block title %}PHILO-TECH{% endblock %}
{% block body %}
<div class="pt-shell" x-data="{ tab: 'lessons' }">
  <div class="pt-header">
    <span class="brand">PHILO-TECH</span>
    <span style="font-size:.9rem">{{ student.full_name }} ·
      <a href="/student/logout" style="color:#ffd7d7">خروج</a></span>
  </div>

  <div class="pt-main">
    <div class="htmx-indicator muted" style="text-align:center">…جارٍ التحميل</div>
    <!-- محتوى التبويب يُحمَّل عبر HTMX -->
    <div id="tabview"
         hx-get="/student/tab/lessons" hx-trigger="load"
         hx-indicator=".htmx-indicator">
    </div>
  </div>

  <nav class="pt-tabs">
    <button :class="{active: tab==='lessons'}" @click="tab='lessons'"
            hx-get="/student/tab/lessons" hx-target="#tabview" hx-indicator=".htmx-indicator">الدروس</button>
    <button :class="{active: tab==='assessments'}" @click="tab='assessments'"
            hx-get="/student/tab/assessments" hx-target="#tabview" hx-indicator=".htmx-indicator">التقاويم</button>
    <button :class="{active: tab==='scores'}" @click="tab='scores'"
            hx-get="/student/tab/scores" hx-target="#tabview" hx-indicator=".htmx-indicator">النقط</button>
  </nav>
</div>
{% endblock %}
