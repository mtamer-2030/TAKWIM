{% extends "student/base.html" %}
{% block title %}تأكيد · PHILO-TECH{% endblock %}
{% block body %}
<div class="pt-shell">
  <div class="pt-header"><span class="brand">PHILO-TECH</span></div>
  <div class="pt-main">
    <div style="text-align:center;margin:2rem 0 1rem">
      <div class="muted">هل أنت؟</div>
      <div style="font-size:1.8rem;font-weight:800;margin:.5rem 0">{{ student.full_name }}</div>
      {% if student.group_name %}<div class="muted">القسم: {{ student.group_name }}</div>{% endif %}
    </div>

    <form method="post" action="/student/login/confirm">
      <input type="hidden" name="code" value="{{ code }}">
      <button class="pt-btn" type="submit">نعم، هذا أنا — دخول</button>
    </form>

    <div style="height:.75rem"></div>
    <a href="/student" class="pt-btn" style="background:#eee;color:#333;display:block;text-align:center;text-decoration:none">
      لستُ أنا — رجوع</a>

    <p class="muted" style="text-align:center;margin-top:1rem;font-size:.85rem">
      تأكّد أنّ الاسم اسمك قبل المتابعة.</p>
  </div>
</div>
{% endblock %}
