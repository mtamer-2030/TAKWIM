{% extends "base.html" %}
{% block title %}مباشر {{ s.class_label }} · PHILO-TECH{% endblock %}
{% block body %}
{% include "teacher/_nav.html" %}
<div class="wrap">
  <h1>المتابعة المباشرة — {{ s.class_label }}</h1>
  <p class="small muted">{{ s.title }} · <span id="live-status">يتّصل…</span></p>

  <div id="rejections"></div>

  <div class="statbar">
    <div class="stat"><b id="stat-present">0</b> حاضر</div>
    <div class="stat"><b id="stat-active">0</b> يعمل</div>
    <div class="stat"><b id="stat-submitted">0</b> سلّم</div>
    <div class="stat"><b id="stat-total-q">{{ 0 }}</b> أسئلة</div>
  </div>

  <div class="live-grid" id="grid"></div>

  <p style="margin-top:1rem">
    <a class="btn ghost" href="/teacher/sessions/{{ s.id }}">إدارة الجلسة</a>
    <a class="btn ghost" href="/teacher/sessions/{{ s.id }}/grade">التصحيح</a>
  </p>
</div>

<script>
window.MIHAKK_SESSION = {{ s.id }};
</script>
<script src="/static/js/live.js"></script>
{% endblock %}
