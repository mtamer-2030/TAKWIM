{% extends "base.html" %}
{% block title %}دخول الأستاذ · PHILO-TECH{% endblock %}
{% block body %}
<div class="wrap narrow">
  <h1>PHILO-TECH · لوحة الأستاذ</h1>
  {% if error %}<div class="notice err">{{ error }}</div>{% endif %}
  <form method="post" action="/teacher/login" class="card">
    <label for="password">كلمة السرّ</label>
    <input id="password" name="password" type="password" autofocus autocomplete="current-password">
    <p><button class="btn big" type="submit">دخول</button></p>
    <p class="muted small">كلمة السرّ في ملفّ <span class="mono">config.ini</span>.</p>
  </form>
</div>
{% endblock %}
